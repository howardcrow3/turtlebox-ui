<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Turtlebox Downloads panel</title>
<link rel="stylesheet" href="../css/fonts.css"><link rel="stylesheet" href="../css/tokens.css"><link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/extensions.css"><link rel="stylesheet" href="../css/downloads.css">
<style>body{margin:0;background:var(--paper);font-family:var(--sans)}.pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:0}.pane{background:var(--paper);color:var(--body);padding:16px 20px 28px;min-height:520px}.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.bar b{color:var(--ink);font-size:13px}h1{font-size:15px;margin:0 0 12px;color:var(--ink)}</style>
<body>
<div class="pair">
<section class="pane"><h1>Light</h1><div class="bar"><b>Toolbar</b><span class="tb-dl-anchor" id="a1"></span></div></section>
<section class="pane tb-dark"><h1>Dark</h1><div class="bar"><b>Toolbar</b><span class="tb-dl-anchor" id="a2"></span></div></section>
</div>
<script type="module">
import { createDownloads, statusLine, percent } from '../js/tb-downloads.js';
const ICON={dl:'<svg viewBox="0 0 16 16"><path d="M8 2v8M4.5 7 8 10.5 11.5 7M3 13.5h10"/></svg>',x:'<svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6"/></svg>',p:'<svg viewBox="0 0 12 12"><path d="M4 2.5v7M8 2.5v7"/></svg>',r:'<svg viewBox="0 0 12 12"><path d="M4 2.5 9.5 6 4 9.5z"/></svg>',re:'<svg viewBox="0 0 12 12"><path d="M10 6a4 4 0 1 1-1.2-2.8M10 2v2.5H7.5"/></svg>'};
let t=0; const dl=createDownloads({now:()=>t});
dl.update({id:'m',name:'openai/gpt-oss-120b',total:63.39e9,done:31.75e9,state:'running'});
t=1000; dl.update({id:'m',done:31.752e9});
dl.update({id:'p',name:'Qwen 3 8B',total:4.9e9,done:1.2e9,state:'paused'});
dl.update({id:'d',name:'CeeVee update 0.9.2',total:96e6,done:96e6,state:'done'});
dl.update({id:'f',name:'Embedding model',total:600e6,done:80e6,state:'failed',error:'The connection dropped'});
function acts(i){const b=(k,l)=>`<button class="tb-dl-act" aria-label="${l}" title="${l}">${ICON[k]}</button>`;
 if(i.state==='running')return b('p','Pause')+b('x','Cancel');if(i.state==='paused')return b('r','Resume')+b('x','Cancel');if(i.state==='failed'||i.state==='canceled')return b('re','Retry');return''}
function row(i){return `<div class="tb-dl-item" data-state="${i.state}"><div class="tb-dl-name">${i.name}</div><div class="tb-dl-acts">${acts(i)}</div>${['done','canceled'].includes(i.state)?'':`<div class="tb-progress" role="progressbar" aria-valuenow="${percent(i.done,i.total)}" aria-valuemin="0" aria-valuemax="100" style="--v:${i.total?i.done/i.total:0}"><i></i></div>`}<div class="tb-dl-meta">${statusLine(i)}</div></div>`}
const g=dl.groups();
const html=`<button class="tb-dl-btn" aria-expanded="true" aria-label="Downloads, ${dl.activeCount()} active">${ICON.dl}<span class="tb-dl-badge">${dl.activeCount()}</span></button><div class="tb-dl" role="dialog" aria-label="Downloads"><div class="tb-dl-head"><h2>Downloads</h2><button class="tb-dl-act" aria-label="Close">${ICON.x}</button></div><input class="tb-dl-filter" placeholder="Filter downloads..." aria-label="Filter downloads"><div class="tb-dl-group"><div class="tb-dl-glabel">Ongoing</div>${g.ongoing.map(row).join('')}</div><div class="tb-dl-group"><div class="tb-dl-glabel">Completed <button class="tb-dl-link">Clear all</button></div>${g.completed.map(row).join('')}</div></div>`;
for(const id of['a1','a2'])document.getElementById(id).innerHTML=html;
</script></body></html>
